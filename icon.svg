<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A83FF"/>
      <stop offset="0.52" stop-color="#6060F0"/>
      <stop offset="1" stop-color="#2E2A78"/>
    </linearGradient>
    <linearGradient id="gCard" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7EAFF"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FE7B4"/>
      <stop offset="1" stop-color="#30CC96"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A0B2A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#gTile)"/>
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#sheen)"/>

  <!-- card -->
  <g transform="rotate(-12 64 66)" filter="url(#soft)">
    <rect x="26" y="47" width="77" height="52" rx="9" fill="url(#gCard)"/>
    <!-- chip -->
    <rect x="35" y="59" width="16" height="12.5" rx="3" fill="url(#gGreen)"/>
    <path d="M43 59 V71.5 M35 65.2 H51" stroke="#0A0F1A" stroke-opacity="0.14" stroke-width="1"/>
    <!-- stripe -->
    <rect x="35" y="82" width="59" height="4.5" rx="2.25" fill="#6060F0" opacity="0.32"/>
    <rect x="35" y="82" width="30" height="4.5" rx="2.25" fill="#6060F0" opacity="0.22"/>
  </g>

  <!-- sparkle -->
  <g>
    <path d="M100 15
             C100 30, 100 33, 121 37
             C100 41, 100 44, 100 59
             C100 44, 100 41, 79 37
             C100 33, 100 30, 100 15 Z" fill="url(#gGreen)"/>
    <circle cx="100" cy="37" r="3.4" fill="#EAFBF3"/>
    <path d="M116 55 C116 61,116 62,124 63.5 C116 65,116 66,116 72 C116 66,116 65,108 63.5 C116 62,116 61,116 55 Z" fill="#7CEBC4"/>
  </g>
</svg>
